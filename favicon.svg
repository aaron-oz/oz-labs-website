<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="gp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="3" seed="8" result="noise"/>
      <feComponentTransfer in="noise" result="final">
        <feFuncR type="table" tableValues="0.04 0.4 0.5 0.13"/>
        <feFuncG type="table" tableValues="0.04 0.4 0.5 0.83"/>
        <feFuncB type="table" tableValues="0.1 0.95 0.65 0.93"/>
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="clip">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="32" height="32" filter="url(#gp)"/>
  </g>
  <text x="16" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5))">OZ</text>
</svg>
